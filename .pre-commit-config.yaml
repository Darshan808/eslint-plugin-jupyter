repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        types_or:
          - ts
          - tsx
          - javascript
          - json
          - markdown
          - yaml

  - repo: local
    hooks:
      - id: npm-lint
        name: npm lint
        entry: npm run lint --
        language: system
        types_or: [ts, tsx, javascript]
        pass_filenames: true
